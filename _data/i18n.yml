# Site languages and interface strings.
#
# The first language is the default: it is what visitors without JavaScript
# see, and it is the fallback for any string or data field with no translation.
# The selector in the navbar lists every language here.
#
# Translating data files: next to any field rendered through
# _includes/tf.html, add `<field>_<code>` (e.g. `description_es`). Leave it
# out and that language shows the default text. The CV build ignores these.
languages:
  - code: en
    name: English
    short: EN
  - code: es
    name: Español
    short: ES
  - code: ca
    name: Català
    short: CA

# Plain text substitutions applied to dates and places (_includes/tx.html),
# in order -- full month names come before their abbreviations.
