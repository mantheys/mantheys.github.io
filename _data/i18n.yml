  site_title:
    en: Particle Physicist, Ph.D. Candidate
    es: Físico de partículas, doctorando
    de: "Teilchenphysiker, Doktorand"

  # Home
  chip_oscillations: {en: Neutrino Oscillations, es: Oscilaciones de neutrinos, de: "Neutrinooszillationen"}
  chip_solar:        {en: Solar Neutrinos, es: Neutrinos solares, de: "Sonnenneutrinos"}
  chip_lartpc:       {en: Liquid Argon TPCs, es: TPC de argón líquido, de: "Flüssigargon-TPCs"}
  chip_pds:          {en: Photon Detection, es: Detección de fotones, de: "Photonendetektion"}
  home_intro:
    en: >-
      I work on low-energy neutrino physics for the **Deep Underground Neutrino Experiment**
      (DUNE), spanning detector hardware and physics analysis. My work covers cryogenic
      characterisation of **X-ARAPUCA** photon detectors, Monte Carlo simulation and
      reconstruction of low-energy charge and scintillation signals in LArSoft, and
      sensitivity studies for **solar neutrinos** — the day–night asymmetry, HEP neutrino
      discovery potential, and DUNE's reach on the solar oscillation parameters.
    es: >-
      Trabajo en física de neutrinos de baja energía para el **Deep Underground Neutrino
      Experiment** (DUNE), desde el hardware del detector hasta el análisis físico. Mi trabajo
      abarca la caracterización criogénica de los fotodetectores **X-ARAPUCA**, la simulación
      Monte Carlo y la reconstrucción de señales de carga y centelleo de baja energía en
      LArSoft, y estudios de sensibilidad a **neutrinos solares**: la asimetría día–noche, el
      potencial de descubrimiento de neutrinos HEP y el alcance de DUNE sobre los parámetros de
      oscilación solar.
    de: "Ich arbeite an niederenergetischer Neutrinophysik für das **Deep Underground Neutrino Experiment** (DUNE), von der Detektorhardware bis zur Physikanalyse. Meine Arbeit umfasst die kryogene Charakterisierung der **X-ARAPUCA**-Photodetektoren, die Monte-Carlo-Simulation und Rekonstruktion niederenergetischer Ladungs- und Szintillationssignale in LArSoft sowie Sensitivitätsstudien zu **Sonnenneutrinos**: die Tag-Nacht-Asymmetrie, das Entdeckungspotenzial für HEP-Neutrinos und die Reichweite von DUNE bei den Parametern der solaren Oszillation."
