# Selected code, shown on the Projects page in the order listed.
# Each entry needs: name, description
# Optional: repo, website, docs, paper, language, license, role
- name: SNUfish
  repo: https://github.com/mantheys/snufish
  website: https://mantheys.github.io/snufish/
  language: Python, JavaScript
  license: MIT
  description: >-
    Community benchmarks of solar neutrino tools. Every tool computes the same
    fixed problem, from standard solar models through MSW propagation in the Sun
    and Earth to cross sections and event rates, and SNUfish validates the
    outputs and plots them side by side with plotipus. A static web calculator
    on the same engine gives spectra, day-night asymmetries and uncertainty
    budgets for a chosen detector in the browser.
  description_es: >-
    Comparativas comunitarias de herramientas de neutrinos solares. Todas las
    herramientas calculan el mismo problema fijo, desde los modelos solares estándar
    y la propagación MSW en el Sol y la Tierra hasta las secciones eficaces y las
    tasas de sucesos, y SNUfish valida los resultados y los representa juntos con
    plotipus. Una calculadora web estática sobre el mismo motor ofrece espectros,
    asimetrías día-noche y presupuestos de incertidumbre para un detector elegido,
    directamente en el navegador.
  description_de: >-
    Gemeinschaftliche Vergleichstests für Werkzeuge der Sonnenneutrinophysik. Alle
    Werkzeuge berechnen dasselbe festgelegte Problem, von Standardsonnenmodellen über
    die MSW-Propagation in Sonne und Erde bis zu Wirkungsquerschnitten und
    Ereignisraten; SNUfish validiert die Ergebnisse und stellt sie mit plotipus
    nebeneinander dar. Ein statischer Web-Rechner auf derselben Grundlage liefert
    Spektren, Tag-Nacht-Asymmetrien und Unsicherheitsbudgets für einen gewählten
    Detektor direkt im Browser.

- name: plotipus
  repo: https://github.com/mantheys/plotipus
  language: Python
  license: MIT
  description: >-
    Publication plots and tables from pickled pandas DataFrames, driven by plain
    text command lists. Keeps figure definitions in version control alongside the
    analysis rather than in one-off scripts, so a paper's figures can be
    regenerated from a single command file.
  description_es: >-
    Gráficas y tablas para publicaciones a partir de DataFrames de pandas
    serializados, guiadas por listas de comandos en texto plano. Mantiene la
    definición de las figuras bajo control de versiones junto al análisis, en lugar
    de en scripts sueltos, de modo que las figuras de un artículo se pueden
    regenerar con un único archivo de comandos.
  description_de: >-
    Abbildungen und Tabellen für Veröffentlichungen aus serialisierten
    pandas-DataFrames, gesteuert über Befehlslisten im Klartext. Die
    Abbildungsdefinitionen liegen so neben der Analyse in der Versionsverwaltung
    statt in Einmal-Skripten, und die Abbildungen eines Artikels lassen sich mit
    einer einzigen Befehlsdatei neu erzeugen.

- name: cathersis
