# Optional: repo, website, docs, paper, language, license, role
- name: plotipus
  repo: https://github.com/mantheys/plotipus
  language: Python
  license: MIT
  description: >-
    Publication plots and tables from pickled pandas DataFrames, driven by plain
    text command lists. Keeps figure definitions in version control alongside the
    analysis rather than in one-off scripts, so a paper's figures can be
    regenerated from a single command file.

