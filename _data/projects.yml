  description_es: >-
    Fuentes LaTeX de mi tesis doctoral, *Liquid Argon Detector Development for the
    Neutrino Oscillation Measurement with the DUNE experiment*.
  description_de: >-
    LaTeX-Quellen meiner Dissertation, *Liquid Argon Detector Development for the
    Neutrino Oscillation Measurement with the DUNE experiment*.
