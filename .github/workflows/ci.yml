name: CI

# On every pull request: builds the CV PDF, builds the site, and checks internal
# links. Deployment happens separately in deploy.yml on push to `main`.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Deployment uses 4.0; 3.4 is kept so local setups on the previous
        # stable Ruby keep working.
        ruby: ['3.4', '4.0']
    name: build (ruby ${{ matrix.ruby }})
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production

      # Safari and older browsers cannot use the SVG favicon; rasterize it so
      # favicon.ico and the iOS home-screen icon match the generated SVG.
      - name: Rasterize favicon
        run: |
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq librsvg2-bin imagemagick >/dev/null
          rsvg-convert -w 180 -h 180 _site/favicon.svg -o _site/apple-touch-icon.png
          rsvg-convert -w 32  -h 32  _site/favicon.svg -o _site/favicon-32.png
          rsvg-convert -w 16  -h 16  _site/favicon.svg -o _site/favicon-16.png
          convert _site/favicon-16.png _site/favicon-32.png _site/favicon.ico
          rm _site/favicon-16.png _site/favicon-32.png

      - name: Check internal links
        run: |
          gem install html-proofer --no-document
          htmlproofer ./_site \
            --disable-external \
            --allow-missing-href \
            --ignore-missing-alt \
            --no-enforce-https

  cv:
    runs-on: ubuntu-latest
    name: cv pdf
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      # Same package set as deploy.yml: fontspec and unicode-math (xetex),
      # tcolorbox and enumitem (latex-extra), sourcesanspro and fontawesome
      # (fonts-extra), academicons (science).
      - name: Install CV build dependencies
        run: |
          python -m pip install -r tools/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-fonts-extra \
            texlive-science fonts-font-awesome

      # Catches a broken template or data file here, rather than after merge
      # when deploy.yml would fail and quietly leave the old site published.
      - name: Build CV PDF
        run: python tools/build_cv.py

      # The published CV must carry no home address or phone number. Assert that
      # structurally -- naming the actual values here would commit them to this
      # public repo, which is the very thing _data/private.yml exists to avoid.
      - name: Check the public CV declares no private contact details
        run: |
          if grep -q '^\\mobile{' cv/cv.tex; then
            echo "::error::cv/cv.tex emits a phone number in a non-private build"
            exit 1
          fi
          inst=$(python3 -c "import yaml;print(yaml.safe_load(open('_data/profile.yml'))['institution'])")
          if ! grep -qF "\\address{$inst}" cv/cv.tex; then
            echo "::error::the public CV address is not the institution fallback"
            exit 1
          fi
          echo "public CV declares institution only"
