name: Refresh publications from INSPIRE

# INSPIRE picks up new DUNE papers continuously. Re-query weekly, and open a
# commit only when the record actually changed, so the site and the CV PDF stay
# current without manual work.
on:
  schedule:
    - cron: "0 5 * * 1"   # Mondays, 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - run: python -m pip install -r tools/requirements.txt

      - name: Query INSPIRE-HEP
        run: python tools/fetch_inspire.py

      - name: Commit if the record changed
        run: |
          if git diff --quiet -- assets/ref.bib _data/publications.yml; then
            echo "No new publications."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ref.bib _data/publications.yml
          git commit -m "Refresh publications from INSPIRE-HEP"
          git push
