<!DOCTYPE html>
{%- assign default_lang = site.data.i18n.languages.first.code | default: 'en' -%}
<html lang="{{ default_lang }}" data-lang="{{ default_lang }}">

  {% include head.html %}

  <body data-baseurl="{{ site.baseurl }}">
    <a class="skip-link" href="#main">{% include t.html key="skip" %}</a>
    {% include icons.svg %}

    {% include header.html %}

    <main id="main" class="site-container">
      {{ content }}
    </main>

    {% include footer.html %}

  </body>

</html>
